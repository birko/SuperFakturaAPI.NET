name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SuperFaktura.slnx

      - name: Build
        run: dotnet build SuperFaktura.slnx --configuration Release --no-restore

      # Offline tests only: they check requests and responses without calling the API.
      # Integration tests need sandbox credentials (SuperFaktura.Tests/Properties/launchSettings.json).
      - name: Test
        run: dotnet test SuperFaktura.slnx --configuration Release --no-build --filter "FullyQualifiedName~SerializationTest"

      # Tag v1.2.3 publishes version 1.2.3; other builds use <Version> from SuperFaktura.csproj.
      - name: Pack
        run: |
          VERSION_ARG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_ARG="-p:PackageVersion=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack SuperFaktura/SuperFaktura.csproj --configuration Release --no-build --output out $VERSION_ARG

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: out/*.nupkg

  # nuget.org Trusted Publishing: a GitHub OIDC token is exchanged for a 1 hour API key, no stored key.
  # Requires a Trusted Publishing policy on nuget.org: owner "birko", repository "SuperFakturaAPI.NET",
  # workflow file "ci.yml"; and secret NUGET_USER = nuget.org profile name (not the email).
  publish:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: out

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
